<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f172a" />
  <title>PINTU GURU — SMPN 2 WONOMERTO</title>
  <link rel="icon" href="https://www.image2url.com/r2/default/images/1791341222004-8d4bab53-e9c3-42a4-9f3a-e3dffff99157.jpg" />

  <!-- ═════════ PWA : agar aplikasi bisa DIPASANG seperti aplikasi asli ═════════ -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="PINTU GURU" />
  <meta name="pg-pwa-versi" content="4" />
  <!-- ═════════ akhir blok PWA ═════════ -->

  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;background:#0f172a;overflow:hidden}
    .iframe-container{width:100%;height:100dvh;overflow:hidden;position:relative}
    iframe{display:block;width:100%;height:100%;border:none}
    /* Layar loading sementara iframe memuat */
    #loader{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
      align-items:center;justify-content:center;color:#a5b4fc;
      font-family:sans-serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase;
      background:linear-gradient(135deg,#0f172a,#1e1b4b);transition:opacity .5s}
    #loader.done{opacity:0;pointer-events:none}
    #loader .dot{width:10px;height:10px;border-radius:50%;background:#818cf8;
      animation:l 1.1s infinite ease-in-out}
    #loader .dot:nth-child(2){animation-delay:-.15s}
    #loader .dot:nth-child(3){animation-delay:-.3s}
    @keyframes l{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

    /* ═══ PWA v4: TANPA tombol — tawaran pasang lewat TOAST ═══
       Toast muncul sekali per sesi, ketuk untuk memasang, menutup sendiri
       ±12 detik, dan TIDAK PERNAH muncul bila aplikasi sudah terpasang. */
    #pgToastPwa{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;
      z-index:99990;display:flex;align-items:center;gap:10px;max-width:92vw;
      background:#0f172a;color:#fff;padding:12px 14px;border-radius:14px;
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13.5px;
      line-height:1.45;box-shadow:0 10px 30px rgba(2,6,23,.55);cursor:pointer;
      border:1px solid #334155}
    #pgToastPwa[hidden]{display:none}
    #pgToastPwa:active{transform:translateX(-50%) scale(.98)}
    @media (max-width:760px){ #pgToastPwa{bottom:88px} } /* di atas bottom nav aplikasi */
    #pgToastTutup{border:0;background:transparent;color:#94a3b8;font-size:15px;
      cursor:pointer;padding:2px 4px;line-height:1}
    #pgToastTutup:hover{color:#e2e8f0}

    #pgCaraIOS{position:fixed;inset:0;z-index:99995;display:flex;
      align-items:center;justify-content:center;background:rgba(2,6,23,.72);padding:20px}
    #pgCaraIOS[hidden]{display:none}
    .pgCaraKartu{max-width:360px;width:100%;background:#1e293b;border:1px solid #334155;
      border-radius:18px;padding:22px;color:#e2e8f0;
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    .pgCaraKartu h3{margin:0 0 14px;font-size:16px;color:#a5b4fc}
    .pgCaraKartu ol{margin:0 0 18px;padding-left:20px}
    .pgCaraKartu li{font-size:14px;line-height:1.9}
    .pgCaraKartu b{color:#f8fafc}
    .pgTutupCara{width:100%;border:0;border-radius:12px;padding:11px;font-size:14px;
      font-weight:600;background:#334155;color:#e2e8f0;cursor:pointer}
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe id="app" title="PINTU GURU"
      src="https://script.google.com/macros/s/AKfycbxIL2AYrMhqYN3imHX3Hl7CWHqpjqyISH_2JKJDfEOTaJVNbknijC99jOpJ6QryQO-XJQ/exec"
      allow="fullscreen; camera">
    </iframe>
    <div id="loader">
      <div style="display:flex;gap:10px"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      Memuat aplikasi…
    </div>
  </div>

  <!-- Toast tawaran pemasangan: muncul SEKALI per sesi, hanya bila aplikasi
       BELUM terpasang dan perangkat bisa memasang. Ketuk = pasang.
       Sudah terpasang → tidak pernah muncul lagi. -->
  <div id="pgToastPwa" hidden role="status" aria-label="Tawaran pemasangan aplikasi">
    <span id="pgToastTeks"></span>
    <button id="pgToastTutup" type="button" aria-label="Tutup">✕</button>
  </div>

  <!-- Petunjuk pemasangan untuk iPhone / iPad (Safari tidak mendukung auto-prompt) -->
  <div id="pgCaraIOS" hidden>
    <div class="pgCaraKartu">
      <h3>Pasang PINTU GURU di iPhone / iPad</h3>
      <ol>
        <li>Buka menu <b>Bagikan</b> (kotak dengan panah ke atas) di bawah layar Safari</li>
        <li>Gulir lalu pilih <b>“Tambahkan ke Layar Utama”</b></li>
        <li>Ketuk <b>Tambah</b> — ikon PINTU GURU muncul di layar utama</li>
      </ol>
      <button class="pgTutupCara" id="pgCaraTutup" type="button">Tutup</button>
    </div>
  </div>

  <script>
    document.getElementById('app').addEventListener('load', function(){
      document.getElementById('loader').classList.add('done');
    });

    /* ═══ PWA v4: service worker + toast tawaran pasang (TANPA tombol) ═══ */
    (function(){
      console.log('[PWA] Pembungkus v4 aktif — tanpa tombol: tawaran pasang lewat toast, sekali per sesi, hilang permanen bila terpasang');
      window.PG_PWA_VERSI = 4;   /* cara cek versi: F12 -> console / ketik PG_PWA_VERSI */

      var toast  = document.getElementById('pgToastPwa');
      var teks   = document.getElementById('pgToastTeks');
      var tutup  = document.getElementById('pgToastTutup');
      var cara   = document.getElementById('pgCaraIOS');
      var tutupC = document.getElementById('pgCaraTutup');
      var frame  = document.getElementById('app');
      var deferred   = null;   /* browser melapor: aplikasi siap dipasang */
      var appSiap    = false;  /* aplikasi GAS sudah melapor (login/masuk) */
      var tenDetik   = false;  /* cadangan waktu: 10 detik berlalu */
      var timerTutup = null;

      /* iPhone/iPad: Safari tidak mengirim beforeinstallprompt */
      var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      /* Sudah terpasang? → toast TIDAK PERNAH muncul lagi.
         Dicatat permanen di perangkat (localStorage) + deteksi mode standalone. */
      function sudahTerpasang(){
        var tanda = false;
        try{ tanda = localStorage.getItem('pgSudahTerpasang') === '1'; }catch(e){}
        return tanda ||
               window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
      }

      function sembunyikanToast(){
        if (timerTutup){ clearTimeout(timerTutup); timerTutup = null; }
        toast.hidden = true;
      }

      /* Tawarkan pemasangan lewat toast — paling banyak SEKALI per sesi. */
      function mungkinTawar(){
        if (sudahTerpasang()) return;                 /* sudah terpasang → diam */
        try{ if (sessionStorage.getItem('pgTawarSesi') === '1') return; }catch(e){}
        if (!deferred && !iOS) return;                /* perangkat tak bisa memasang */
        if (!appSiap && !tenDetik) return;            /* tunggu aplikasi termuat dulu */
        try{ sessionStorage.setItem('pgTawarSesi','1'); }catch(e){}
        teks.innerHTML = iOS
          ? '📲 iPhone/iPad: tekan <b>Bagikan</b> lalu <b>“Tambahkan ke Layar Utama”</b> — ketuk di sini untuk petunjuk'
          : '📲 Aplikasi PINTU GURU bisa dipasang di perangkat ini — <b>ketuk di sini</b> untuk memasang';
        toast.hidden = false;
        if (timerTutup) clearTimeout(timerTutup);
        timerTutup = setTimeout(sembunyikanToast, 12000);   /* menutup sendiri ±12 dtk */
      }

      /* 1. Daftarkan service worker (syarat wajib agar bisa dipasang) */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function(){
          navigator.serviceWorker.register('sw.js').catch(function(){});
        });
      }

      /* 2. Chrome/Edge/Android: browser melapor aplikasi siap dipasang */
      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        deferred = e;
        mungkinTawar();
      });

      /* 3. Aplikasi (di dalam iframe) mengabari keadaannya — dipakai hanya
            untuk MENUNDTA waktu tawaran sampai aplikasi benar-benar termuat.
            Sumber diverifikasi dengan menelusuri rantai parent sampai ketemu
            iframe aplikasi (pesan palsu dari halaman sendiri diabaikan). */
      function dariAplikasi(win){
        try{
          var w = win, i = 0;
          while (w && i < 8){
            if (w === frame.contentWindow) return true;   /* dari iframe aplikasi */
            if (w === window) return false;               /* dari halaman ini sendiri */
            w = w.parent; i++;
          }
        }catch(e){}
        return false;
      }
      window.addEventListener('message', function(e){
        if (!frame || !dariAplikasi(e.source)) return;
        var d = e.data;
        if (!d || (d.pgPintuGuru !== 'login' && d.pgPintuGuru !== 'masuk')) return;
        appSiap = true;
        mungkinTawar();
      });

      /* 4. Ketuk toast → pasang (atau buka petunjuk iPhone) */
      toast.addEventListener('click', function(){
        if (iOS || !deferred){ cara.hidden = false; sembunyikanToast(); return; }
        var d = deferred;
        sembunyikanToast();
        d.prompt();
        d.userChoice.then(function(){ d = null; });
      });
      tutup.addEventListener('click', function(e){
        e.stopPropagation();
        sembunyikanToast();
      });

      tutupC.addEventListener('click', function(){ cara.hidden = true; });
      cara.addEventListener('click', function(e){ if (e.target === cara) cara.hidden = true; });

      /* 5. Selesai dipasang → catat permanen; toast & tawaran berhenti selamanya */
      window.addEventListener('appinstalled', function(){
        try{ localStorage.setItem('pgSudahTerpasang','1'); }catch(e){}
        sembunyikanToast();
      });

      /* Cadangan waktu: bila pesan dari aplikasi tak kunjung datang,
         tawaran tetap muncul setelah 10 detik. */
      setTimeout(function(){ tenDetik = true; mungkinTawar(); }, 10000);

      /* Hook kecil untuk diagnosa/uji (tidak mengubah perilaku): */
      window.__pgPwaUji = {
        tawar: mungkinTawar,
        status: function(){
          return { versi: window.PG_PWA_VERSI, terpasang: sudahTerpasang(),
                   deferred: !!deferred, appSiap: appSiap, iOS: iOS,
                   toastTampil: !toast.hidden };
        }
      };
    })();
  </script>
</body>
</html>
