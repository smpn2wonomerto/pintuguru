<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#0f172a" />
  <title>PINTU GURU — SMPN 2 WONOMERTO</title>
  <link rel="icon" href="https://www.image2url.com/r2/default/images/1791341222004-8d4bab53-e9c3-42a4-9f3a-e3dffff99157.jpg" />

  <!-- ═════════ PWA : agar aplikasi bisa DIPASANG seperti aplikasi asli ═════════ -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="PINTU GURU" />
  <meta name="pg-pwa-versi" content="3" />
  <!-- ═════════ akhir blok PWA ═════════ -->

  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;background:#0f172a;overflow:hidden}
    .iframe-container{width:100%;height:100dvh;overflow:hidden;position:relative}
    iframe{display:block;width:100%;height:100%;border:none}
    /* Layar loading sementara iframe memuat */
    #loader{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;
      align-items:center;justify-content:center;color:#a5b4fc;
      font-family:sans-serif;font-size:14px;letter-spacing:.2em;text-transform:uppercase;
      background:linear-gradient(135deg,#0f172a,#1e1b4b);transition:opacity .5s}
    #loader.done{opacity:0;pointer-events:none}
    #loader .dot{width:10px;height:10px;border-radius:50%;background:#818cf8;
      animation:l 1.1s infinite ease-in-out}
    #loader .dot:nth-child(2){animation-delay:-.15s}
    #loader .dot:nth-child(3){animation-delay:-.3s}
    @keyframes l{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

    /* ═══ PWA: tombol pasang + petunjuk iPhone/iPad ═══ */
    #btnPasang{position:fixed;right:16px;bottom:18px;z-index:99990;
      display:flex;align-items:center;gap:8px;border:0;border-radius:999px;
      padding:12px 18px;font-size:14px;font-weight:600;font-family:inherit;
      background:#6366f1;color:#fff;box-shadow:0 10px 30px rgba(2,6,23,.55);
      cursor:pointer}
    #btnPasang:active{transform:scale(.97)}
    /* di HP tombol dinaikkan supaya tidak menutupi bottom nav bar di dalam aplikasi */
    @media (max-width:760px){ #btnPasang{bottom:88px} }
    #pgCaraIOS{position:fixed;inset:0;z-index:99995;display:flex;
      align-items:center;justify-content:center;background:rgba(2,6,23,.72);padding:20px}
    #pgCaraIOS[hidden]{display:none}
    .pgCaraKartu{max-width:360px;width:100%;background:#1e293b;border:1px solid #334155;
      border-radius:18px;padding:22px;color:#e2e8f0;
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    .pgCaraKartu h3{margin:0 0 14px;font-size:16px;color:#a5b4fc}
    .pgCaraKartu ol{margin:0 0 18px;padding-left:20px}
    .pgCaraKartu li{font-size:14px;line-height:1.9}
    .pgCaraKartu b{color:#f8fafc}
    .pgTutupCara{width:100%;border:0;border-radius:12px;padding:11px;font-size:14px;
      font-weight:600;background:#334155;color:#e2e8f0;cursor:pointer}
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe id="app" title="PINTU GURU"
      src="https://script.google.com/macros/s/AKfycbxIL2AYrMhqYN3imHX3Hl7CWHqpjqyISH_2JKJDfEOTaJVNbknijC99jOpJ6QryQO-XJQ/exec"
      allow="fullscreen; camera">
    </iframe>
    <div id="loader">
      <div style="display:flex;gap:10px"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      Memuat aplikasi…
    </div>
  </div>

  <!-- Tombol pasang: HANYA tampil saat layar login terbuka DAN aplikasi belum
       terpasang. Setelah terinstall di HP/laptop, tombol hilang permanen.
       (Butuh pasangan: Index.html + Script.html GAS v8.9.2 dengan jembatan
       pgKabariPembungkus) -->
  <button id="btnPasang" hidden aria-label="Pasang aplikasi">📲 Pasang aplikasi</button>

  <!-- Petunjuk pemasangan untuk iPhone / iPad (Safari tidak mendukung auto-prompt) -->
  <div id="pgCaraIOS" hidden>
    <div class="pgCaraKartu">
      <h3>Pasang PINTU GURU di iPhone / iPad</h3>
      <ol>
        <li>Buka menu <b>Bagikan</b> (kotak dengan panah ke atas) di bawah layar Safari</li>
        <li>Gulir lalu pilih <b>“Tambahkan ke Layar Utama”</b></li>
        <li>Ketuk <b>Tambah</b> — ikon PINTU GURU muncul di layar utama</li>
      </ol>
      <button class="pgTutupCara" id="pgCaraTutup" type="button">Tutup</button>
    </div>
  </div>

  <script>
    document.getElementById('app').addEventListener('load', function(){
      document.getElementById('loader').classList.add('done');
    });

    /* ═══ PWA v3: service worker + tombol pasang (HANYA di layar login) ═══ */
    (function(){
      console.log('[PWA] Pembungkus v3 aktif — tombol pasang hanya muncul di layar login (butuh GAS v8.9.2)');
      window.PG_PWA_VERSI = 3;   /* cara cek versi: F12 -> console / ketik PG_PWA_VERSI */

      var btn   = document.getElementById('btnPasang');
      var cara  = document.getElementById('pgCaraIOS');
      var tutup = document.getElementById('pgCaraTutup');
      var frame = document.getElementById('app');
      var deferred      = null;
      var promptSiap    = false;  /* browser sudah melapor: aplikasi siap dipasang */
      var diLogin       = false;  /* aplikasi sedang menampilkan layar login */

      /* iPhone/iPad: Safari tidak mengirim beforeinstallprompt */
      var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      /* Sudah terpasang? → tombol TIDAK PERNAH muncul lagi.
         Dicatat permanen di perangkat (localStorage) + deteksi mode standalone. */
      var tandaiTerpasang = false;
      try{ tandaiTerpasang = localStorage.getItem('pgSudahTerpasang') === '1'; }catch(e){}
      function sudahTerpasang(){
        return tandaiTerpasang ||
               window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
      }

      function perbaruiTombol(){
        if (sudahTerpasang() || !diLogin){ btn.hidden = true; return; }
        if (!promptSiap && !iOS){ btn.hidden = true; return; }
        btn.innerHTML = iOS ? '📲 Tambah ke Layar Utama' : '📲 Pasang aplikasi';
        btn.hidden = false;
      }

      /* 1. Daftarkan service worker (syarat wajib agar bisa dipasang) */
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function(){
          navigator.serviceWorker.register('sw.js').catch(function(){});
        });
      }

      /* 2. Chrome/Edge/Android: browser melapor aplikasi siap dipasang.
            Tombol belum tampil — menunggu konfirmasi "sedang di layar login". */
      window.addEventListener('beforeinstallprompt', function(e){
        e.preventDefault();
        deferred = e;
        promptSiap = true;
        perbaruiTombol();
      });

      /* 3. Aplikasi (di dalam iframe) mengabari keadaannya:
            {pgPintuGuru:'login'} → layar login tampil
            {pgPintuGuru:'masuk'} → pengguna sudah masuk
            Pesan dikirim dari DALAM iframe GAS (bisa dari frame bersarang
            milik Google), jadi sumber diverifikasi dengan menelusuri rantai
            parent sampai ketemu iframe aplikasi — bukan sekadar
            e.source === contentWindow. */
      function dariAplikasi(win){
        try{
          var w = win, i = 0;
          while (w && i < 8){
            if (w === frame.contentWindow) return true;   /* dari iframe aplikasi */
            if (w === window) return false;               /* dari halaman ini sendiri */
            w = w.parent; i++;
          }
        }catch(e){}
        return false;
      }
      window.addEventListener('message', function(e){
        if (!frame || !dariAplikasi(e.source)) return; /* hanya dari aplikasi */
        var d = e.data;
        if (!d || (d.pgPintuGuru !== 'login' && d.pgPintuGuru !== 'masuk')) return;
        diLogin = (d.pgPintuGuru === 'login');
        console.log('[PWA] GAS melapor:', d.pgPintuGuru, '→ tombol', diLogin ? 'BOLEH tampil' : 'disembunyikan');
        perbaruiTombol();
      });

      btn.addEventListener('click', function(){
        if (deferred){
          btn.disabled = true;
          deferred.prompt();
          deferred.userChoice.then(function(){
            deferred = null;
            btn.hidden = true;
            btn.disabled = false;
          });
        } else {
          cara.hidden = false; /* petunjuk manual (iOS / browser tanpa prompt) */
        }
      });

      tutup.addEventListener('click', function(){ cara.hidden = true; });
      cara.addEventListener('click', function(e){ if (e.target === cara) cara.hidden = true; });

      /* 4. Selesai dipasang → hilang dan TIDAK muncul lagi selamanya */
      window.addEventListener('appinstalled', function(){
        tandaiTerpasang = true;
        try{ localStorage.setItem('pgSudahTerpasang','1'); }catch(e){}
        btn.hidden = true;
      });

      perbaruiTombol();
    })();
  </script>
</body>
</html>
